name: ci-test

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "example/**"
      - "packages/**"
      - "pubspec.yaml"
      - "dart_test.yaml"
      - "analysis_options.yaml"
      - ".github/workflows/test.yaml"

jobs:
  core:
    name: Core (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket

    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]

    steps:

      - name: Fetch sources
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}

      - name: Fetch dependencies
        run: dart pub get

      - name: Run analysis
        if: matrix.platform == 'vm'
        run: |
          dart analyze --fatal-infos lib/
          dart analyze test/
          dart analyze tool/

      - name: Run native tests
        if: matrix.platform == 'vm'
        run: dart test --platform vm

      - name: Run codec, transport, resilience and stress tests in Chrome
        if: matrix.platform == 'chrome'
        run: dart test --platform chrome test/message_codec_test.dart test/binary_transport_test.dart test/codec_resilience_test.dart test/socket_stress_test.dart

  adapters:
    name: ${{ matrix.package }} (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
        package: [phoenix_socket_msgpack, phoenix_socket_protobuf]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Fetch dependencies
        run: dart pub get
      - name: Run analysis
        if: matrix.platform == 'vm'
        run: dart analyze --fatal-infos
      - name: Run adapter tests
        run: dart test --platform ${{ matrix.platform }}
      - name: Validate MessagePack example
        if: matrix.package == 'phoenix_socket_msgpack' && matrix.platform == 'vm'
        run: dart run example/main.dart

  protobuf-compatibility:
    name: Protobuf 3.1 (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket_protobuf
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Validate protobuf 3.1 compatibility
        run: |
          trap 'rm -f pubspec_overrides.yaml' EXIT
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            phoenix_socket:
              path: ../phoenix_socket
            protobuf: 3.1.0
          YAML
          dart pub get
          dart analyze --fatal-infos
          dart test --platform ${{ matrix.platform }}

  examples:
    name: Examples (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/protobuf
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Fetch protobuf example dependencies
        run: dart pub get
      - name: Analyze protobuf examples
        if: matrix.platform == 'vm'
        run: dart analyze --fatal-infos
      - name: Run protobuf example tests
        run: dart test --platform ${{ matrix.platform }}
      - name: Run protobuf example
        if: matrix.platform == 'vm'
        run: dart run bin/main.dart
      - name: Validate the Dart example
        if: matrix.platform == 'vm'
        working-directory: example
        run: |
          dart pub get
          dart analyze lib/

  benchmark-workloads:
    name: Benchmark correctness (Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool/browser_comparison
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Fetch dependencies
        run: dart pub get
      - name: Run analysis
        run: dart analyze --fatal-infos
      - name: Run workload correctness tests
        run: dart test

  e2e:
    name: Phoenix E2E (Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Fetch backend dependencies
        working-directory: example/backend
        run: MIX_ENV=test mix deps.get
      - name: Run E2E tests against the embedded backend
        run: dart run tool/run_e2e.dart
