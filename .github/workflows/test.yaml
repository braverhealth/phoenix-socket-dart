name: ci-test

on:
  pull_request:
    paths:
      - "tool/**"
      - "example/**"
      - "packages/**"
      - ".github/workflows/test.yaml"
      - ".github/test-paths.yaml"
      - ".gitattributes"

jobs:
  changes:
    name: Detect affected test suites
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflow: ${{ steps.paths.outputs.workflow }}
      core: ${{ steps.paths.outputs.core }}
      messagepack: ${{ steps.paths.outputs.messagepack }}
      protobuf: ${{ steps.paths.outputs.protobuf }}
      dart_example: ${{ steps.paths.outputs.dart_example }}
      protobuf_examples: ${{ steps.paths.outputs.protobuf_examples }}
      benchmarks: ${{ steps.paths.outputs.benchmarks }}
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Detect changes against the pull request base
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/test-paths.yaml

  core:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true'
    name: Core (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket

    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]

    steps:

      - name: Fetch sources
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}

      - name: Fetch dependencies
        run: dart pub get

      - name: Run analysis
        if: matrix.platform == 'vm'
        run: |
          dart analyze --fatal-infos lib/
          dart analyze test/
          dart analyze tool/

      - name: Run native tests
        if: matrix.platform == 'vm'
        run: dart test --platform vm

      - name: Verify expectations against the Phoenix JavaScript reference
        if: matrix.platform == 'vm'
        run: node tool/long_poll_reference.mjs --check

      - name: Run codec, transport, resilience and stress tests in Chrome
        if: matrix.platform == 'chrome'
        run: dart test --platform chrome test/message_codec_test.dart test/binary_transport_test.dart test/codec_resilience_test.dart test/socket_stress_test.dart test/connection_manager_test.dart test/long_poll_test.dart test/long_poll_reference_test.dart test/long_poll_socket_test.dart test/long_poll_browser_test.dart test/websocket_stability_test.dart test/long_poll_review_test.dart

  messagepack:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.messagepack == 'true'
    name: phoenix_socket_msgpack (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket_msgpack
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Fetch dependencies
        run: dart pub get
      - name: Run analysis
        if: matrix.platform == 'vm'
        run: dart analyze --fatal-infos
      - name: Run adapter tests
        run: dart test --platform ${{ matrix.platform }}
      - name: Validate MessagePack example
        if: matrix.platform == 'vm'
        run: dart run example/main.dart

  protobuf:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.protobuf == 'true'
    name: phoenix_socket_protobuf (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket_protobuf
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Fetch dependencies
        run: dart pub get
      - name: Run analysis
        if: matrix.platform == 'vm'
        run: dart analyze --fatal-infos
      - name: Run adapter tests
        run: dart test --platform ${{ matrix.platform }}

  protobuf-compatibility:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.protobuf == 'true'
    name: Protobuf 3.1 (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket_protobuf
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Validate protobuf 3.1 compatibility
        run: |
          trap 'rm -f pubspec_overrides.yaml' EXIT
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            phoenix_socket:
              path: ../phoenix_socket
            protobuf: 3.1.0
          YAML
          dart pub get
          dart analyze --fatal-infos
          dart test --platform ${{ matrix.platform }}

  protobuf-examples:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.protobuf == 'true' || needs.changes.outputs.protobuf_examples == 'true'
    name: Protobuf examples (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/protobuf
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Fetch protobuf example dependencies
        run: dart pub get
      - name: Analyze protobuf examples
        if: matrix.platform == 'vm'
        run: dart analyze --fatal-infos
      - name: Run protobuf example tests
        run: dart test --platform ${{ matrix.platform }}
      - name: Run protobuf example
        if: matrix.platform == 'vm'
        run: dart run bin/main.dart

  dart-example:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.dart_example == 'true'
    name: Dart example (Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Validate the Dart example
        run: |
          dart pub get
          dart analyze lib/

  benchmark-workloads:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.messagepack == 'true' || needs.changes.outputs.benchmarks == 'true'
    name: Benchmark correctness (Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool/browser_comparison
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Fetch dependencies
        run: dart pub get
      - name: Run analysis
        run: dart analyze --fatal-infos
      - name: Run workload correctness tests
        run: dart test

  e2e:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.backend == 'true'
    name: Phoenix E2E (Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Fetch backend dependencies
        working-directory: example/backend
        run: MIX_ENV=test mix deps.get
      - name: Run E2E tests against the embedded backend
        run: dart run tool/run_e2e.dart

  long-poll-e2e:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.backend == 'true'
    name: Long polling E2E (${{ matrix.platform }}, Dart ${{ matrix.dart }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phoenix_socket
    strategy:
      fail-fast: false
      matrix:
        dart: ["3.4.4", stable]
        platform: [vm, chrome]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          architecture: x64
          sdk: ${{ matrix.dart }}
      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Fetch backend dependencies
        working-directory: example/backend
        run: MIX_ENV=test mix deps.get
      - name: Run real HTTP and CORS tests against Phoenix
        run: dart run tool/run_e2e.dart --long-poll --platform ${{ matrix.platform }}
