name: phoenix_protobuf_example
description: Protobuf payload and envelope examples for phoenix_socket.
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  phoenix_socket: ^1.0.0-rc2
  phoenix_socket_protobuf:
    path: ../../packages/phoenix_socket_protobuf
  protobuf: ^3.1.0
dev_dependencies:
  protoc_plugin: ^21.1.2
  test: ^1.25.2
  stream_channel: ^2.1.2
  lints: ^3.0.0
dependency_overrides:
  phoenix_socket:
    path: ../../packages/phoenix_socket
